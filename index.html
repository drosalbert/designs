<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b5fff" />
  <title>Trip Log</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="app">
    <header>
      <h1>Trip Log</h1>
      <button id="sign-out" type="button" hidden>Sign out</button>
    </header>

    <section id="config-warning" class="warning" hidden>
      <strong>Setup needed.</strong>
      Edit <code>config.js</code> with your Supabase project URL and anon key,
      then run the SQL in <code>supabase/schema.sql</code> against your project.
    </section>

    <section id="auth-view">
      <form id="auth-form">
        <h2>Sign in</h2>
        <label>Email
          <input type="email" id="email" required autocomplete="email" />
        </label>
        <label>Password
          <input type="password" id="password" required minlength="6" autocomplete="current-password" />
        </label>
        <div class="row">
          <button type="submit" data-mode="signin">Sign in</button>
          <button type="submit" data-mode="signup" class="secondary">Sign up</button>
        </div>
        <p id="auth-message" class="message"></p>
      </form>
    </section>

    <section id="app-view" hidden>
      <form id="trip-form">
        <h2>New trip</h2>
        <label>Date
          <input type="date" id="trip-date" required />
        </label>
        <label>Start
          <input type="text" id="trip-start" required placeholder="e.g. Home" />
        </label>
        <label>End
          <input type="text" id="trip-end" required placeholder="e.g. Office" />
        </label>
        <label>Distance (km)
          <input type="number" id="trip-distance" required min="0" step="0.1" inputmode="decimal" />
        </label>
        <button type="submit">Add trip</button>
      </form>

      <section id="trip-list-section">
        <div class="summary">
          <span id="trip-count">0 trips</span>
          <span id="trip-total">0.0 km</span>
        </div>
        <ul id="trip-list"></ul>
      </section>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
